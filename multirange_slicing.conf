master_process on;
daemon off;
worker_processes 1;
error_log stderr notice;
user root;
worker_rlimit_core      10G;
pid        /var/run/nginx-multirange.pid;
working_directory       /var/lib/nginx/cores;
events {}
http {

    server {
        listen 127.0.0.3:8081 default_server;
        server_name _;
        return 444;
    }

	log_format fuzz
    '"$request_completion" "$host" "$request" "$status" '
    '"$http_range" "$slice_range" '
    '"$upstream_cache_status" "$upstream_status" '
    '"$sent_http_content_length" "$body_bytes_sent" "$bytes_sent" '
    '"$pid:$connection"\n';

    #access_log off;
    access_log /dev/stderr fuzz;
    #log_subrequest on;

    proxy_cache_path /mnt/disk1/cache/multirange-splitted
                     keys_zone=multirange-splitted:1m
                     inactive=10s
                     max_size=30m
                     use_temp_path=off;


    split_clients "$gcdn_split_clients_key" $multirange_splitted {
        * multirange-splitted;
    }

    #aio on;
    # postpone_output 1460;  what I want actually is postpone until rename
    #output_buffers 2 32k;
    #proxy_read_timeout 5;

    proxy_cache_lock on;


    proxy_cache_valid 200 206 301 302 15552000s;

    #proxy_cache_use_stale updating;
    #simple_variable gcdn_proxy_cache_lock_updating 1 export;
    #proxy_cache_revalidate    on;
    #proxy_cache_background_update on;
    #proxy_cache_max_range_offset 14000000;


    #simple_variable gcdn_posted_request_loop_break 0 export;

    upstream http_backend {
        server local_origin1:3333;
        server local_origin2:3333;
        #keepalive 32;
        #keepalive_timeout 60s;
        #keepalive_requests 1000000;
    }


    server {
            server_name sliced;
            listen 127.0.0.3:8081;
            #set $gcdn_split_clients_key $scheme$request_uri;
            set $gcdn_split_clients_key $request_uri|$slice_range;
            proxy_cache ${multirange_splitted};

            #conditional cache off
            proxy_cache_max_range_offset 1000;
           # proxy_no_cache $http_pragma $http_authorization;
           # proxy_cache_min_uses 5;
           # proxy_cache_methods GET HEAD;


            #max_ranges 1;
            slice 2m;
            proxy_cache_key "$host|$request_uri|$slice_range";
            proxy_force_ranges on;
            proxy_set_header  Range $slice_range;
            proxy_set_header  User-Agent 'nginx-fe-sliced';
            add_header Cache $upstream_cache_status always;
            add_header conn $connection always;

            location / {
                #rewrite /f2p24b /f1024 break;
                proxy_pass http://http_backend/$request_uri;
            }
    }

    server {
            server_name minuses;
            listen 127.0.0.3:8081;
            #set $gcdn_split_clients_key $scheme$request_uri;
            set $gcdn_split_clients_key $request_uri|$slice_range;
            proxy_cache ${multirange_splitted};

            proxy_cache_min_uses 1024;
            #proxy_no_cache 1;
            #proxy_cache_max_range_offset 100;

            slice 3m;
            proxy_cache_key "$host|$request_uri|$slice_range";
            proxy_force_ranges on;
            proxy_set_header  Range $slice_range;
            proxy_set_header  User-Agent 'nginx-fe-sliced';
            add_header Cache $upstream_cache_status always;
            add_header conn $connection always;

            location / {
                proxy_pass http://http_backend/$request_uri;
            }
    }


    server {
            server_name unsliced;

            set $gcdn_split_clients_key $scheme$request_uri;
            proxy_cache multirange-splitted;
            listen 127.0.0.3:8081;
            proxy_cache_key "$host|$request_uri";
            proxy_force_ranges on;
            add_header Cache $upstream_cache_status always;
            add_header conn $connection always;
            proxy_set_header  User-Agent 'nginx-fe-sliced';

            location / {
                proxy_pass http://http_backend/$request_uri;
            }
    }

    server {
            server_name min_unsliced;
            proxy_cache_min_uses 1024;

            set $gcdn_split_clients_key $scheme$request_uri;
            proxy_cache multirange-splitted;
            listen 127.0.0.3:8081;
            proxy_cache_key "$host|$request_uri";
            proxy_force_ranges on;
            add_header Cache $upstream_cache_status always;
            add_header conn $connection always;
            proxy_set_header  User-Agent 'nginx-fe-sliced';

            location / {
                proxy_pass http://http_backend/$request_uri;
            }
    }

    # origin moved to the standalone nginx-origin.service
    # (vanilla /usr/local/sbin/nginx-plain, /etc/nginx-origin/nginx.conf,
    #  listening 127.0.0.{2,3,4}:3333 + 127.0.0.1:8080, root /var/www/html)
    #server {
    #        listen 3333;
    #        server_name local_origin1 local_origin2;
    #        root /var/www/html/;
    #        location / {
    #        }
    #}


}
